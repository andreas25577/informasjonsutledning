      materiell_hjemmel: utl-40-5
      kildeniva: lov
      behandlingsgrunnlag: utl-83a-1
      innhentingshjemmel: utl-83-1
      saerlig_kategori: nei
  har_saerkullsbarn:
    title: har særkullsbarn
    description: Særkullsbarn som søkeren har.
    range: Saerkullsbarn
    multivalued: true
    annotations:
      jas_klasse: rettsforhold
      materiell_hjemmel: utl-40-5
      kildeniva: lov
      behandlingsgrunnlag: utl-83a-1
      innhentingshjemmel: utl-83-1
      saerlig_kategori: nei
  har_oppholdstillatelse:
    title: har oppholdstillatelse
    description: Oppholdstillatelsen referansepersonen har eller får.
    range: Oppholdstillatelse
    annotations:
      jas_klasse: rettsforhold
      materiell_hjemmel: utl-40-1-b utl-40-1-c utl-40-1-d
      kildeniva: lov
      behandlingsgrunnlag: utl-83a-1
      saerlig_kategori: nei
  er_domfelt_for:
    title: er domfelt for
    description: Straffbart forhold referansepersonen er domfelt for.
    range: StraffbartForhold
    multivalued: true
    annotations:
      jas_klasse: rettsforhold
      materiell_hjemmel: utl-40-6
      kildeniva: lov
      behandlingsgrunnlag: utl-83a-1
      innhentingshjemmel: utl-85-1 utl-85-2 utf-17-8-1
      saerlig_kategori: straffedommer_og_lovovertredelser
  er_mistenkt_eller_siktet_for:
    title: er mistenkt eller siktet for
    description: Straffbart forhold referansepersonen er mistenkt eller siktet for, og som kan få betydning for søknaden.
    range: StraffbartForhold
    multivalued: true
    annotations:
      jas_klasse: rettsforhold
      materiell_hjemmel: utl-40-6
