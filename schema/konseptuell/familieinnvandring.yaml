      innhentingshjemmel: utl-83-1 utf-17-7j-2-e
      saerlig_kategori: nei
  har_levd_i_etablert_samliv_med:
    title: har levd i etablert samliv med
    description: Søkeren har levd i et etablert samliv med referansepersonen i utlandet eller i Norge.
    range: Referanseperson
