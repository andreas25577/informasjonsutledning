id: https://w3id.org/udi/regelverksmodell/felles/kjerne
name: kjerne
title: Kjerneklasser – logisk modell
description: 'Logisk modell: kjerneklasser som brukes av flere fagområder. Hvert element peker med «realiserer» til elementet i den konseptuelle modellen, der hjemlene står. Foreløpig bare det utlendingsloven § 40 krever.'
version: 0.2.0
prefixes:
  linkml: https://w3id.org/linkml/
  kjerne: https://w3id.org/udi/regelverksmodell/felles/kjerne/
default_prefix: kjerne
default_range: string
imports:
- linkml:types
- ../kodeverk/tillatelsestype
classes:
  Person:
    title: Person
    description: Fysisk person som regelverket knytter rettigheter, plikter eller vilkår til.
    annotations:
      realiserer: Person
    slots:
    - fodselsdato
    - statsborgerskap
  Oppholdstillatelse:
    title: Oppholdstillatelse
    description: Tillatelse til å oppholde seg i riket.
    annotations:
      realiserer: Oppholdstillatelse
    slots:
    - innehaver
    - tillatelsestype
    - danner_grunnlag_for_permanent_oppholdstillatelse
  Soknad:
    title: Søknad om oppholdstillatelse
    description: Søknad fra en utlending om oppholdstillatelse.
    annotations:
      realiserer: Soknad
    slots:
    - soker
    - stilt_i_bero
slots:
  fodselsdato:
    title: fødselsdato
    description: Datoen personen er født. Alder utledes av denne.
    range: date
    annotations:
      realiserer: Person.alder
      designvalg: Alder lagres som fødselsdato, slik at alderen kan beregnes på et hvilket som helst tidspunkt.
  statsborgerskap:
    title: statsborgerskap
    description: Staten eller statene personen er borger av.
    multivalued: true
    annotations:
      realiserer: Person.statsborgerskap
      designvalg: Flere verdier, fordi en person kan ha flere statsborgerskap.
  innehaver:
    title: innehaver
    description: Personen tillatelsen er gitt til.
    range: Person
    annotations:
      realiserer: Referanseperson.har_oppholdstillatelse
      designvalg: Relasjonen er lagt i motsatt retning, fra tillatelsen til personen.
  tillatelsestype:
    title: tillatelsestype
    description: Hvilken type oppholdstillatelse det gjelder.
    range: Tillatelsestype
    annotations:
      realiserer: Oppholdstillatelse.type_tillatelse
      designvalg: Kodeverk.
  danner_grunnlag_for_permanent_oppholdstillatelse:
    title: danner grunnlag for permanent oppholdstillatelse
    description: Om tillatelsen kan danne grunnlag for permanent oppholdstillatelse.
    range: boolean
    annotations:
      realiserer: Oppholdstillatelse.type_tillatelse
      designvalg: Skilt ut som eget ja/nei-felt.
  soker:
    title: søker
    description: Personen som søker om oppholdstillatelse.
    range: Person
    annotations:
      realiserer: Soknad.fremmet_av
  stilt_i_bero:
    title: stilt i bero
    description: Om behandlingen av søknaden er stilt i bero.
    range: boolean
    annotations:
      realiserer: Soknad.er_stilt_i_bero_ved
      designvalg: Hendelsen er forenklet til et ja/nei-felt.
