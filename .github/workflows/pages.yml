name: Bygg og publiser nettsted

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Valider skjema og begreper
        run: |
          linkml-validate -s schema/felles/skos-ap-no.yaml -C Begrepssamling begreper/familieinnvandring.yaml
          gen-owl schema/domener/familieinnvandring.yaml > /dev/null
      - name: Bygg nettsted
        run: |
          python verktoy/bygg_nettsted.py
          mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
